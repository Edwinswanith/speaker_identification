services:
  voice-api:
    build: .
    env_file: .env
    ports:
      - "7860:7860"
    volumes:
      - voice-data:/data
      - model-cache:/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  voice-data:
  model-cache:
